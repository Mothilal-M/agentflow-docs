<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients for Edges -->
    <linearGradient id="edge-1" x1="45" y1="45" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EE6F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C8FF3D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="edge-2" x1="155" y1="45" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EE6F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C8FF3D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="edge-3" x1="45" y1="155" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EE6F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C8FF3D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="edge-4" x1="155" y1="155" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EE6F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C8FF3D" stop-opacity="1"/>
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8FF3D" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#5EE6F0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C8FF3D" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Ambient Node Grid & Orbit Halo -->
  <circle cx="100" cy="100" r="76" stroke="url(#ring-grad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="100" cy="100" r="42" stroke="#5EE6F0" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Connecting Edges forming the "X" Matrix -->
  <!-- Top-Left to Center to Bottom-Right -->
  <line x1="45" y1="45" x2="100" y2="100" stroke="url(#edge-1)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="155" y2="155" stroke="url(#edge-4)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Top-Right to Center to Bottom-Left -->
  <line x1="155" y1="45" x2="100" y2="100" stroke="url(#edge-2)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="45" y2="155" stroke="url(#edge-3)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Horizontal Inter-Node Data Bridges (Subtle Graph Connections) -->
  <path d="M 45 45 Q 100 25 155 45" fill="none" stroke="#5EE6F0" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <path d="M 45 155 Q 100 175 155 155" fill="none" stroke="#5EE6F0" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <path d="M 45 45 Q 25 100 45 155" fill="none" stroke="#5EE6F0" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <path d="M 155 45 Q 175 100 155 155" fill="none" stroke="#5EE6F0" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>

  <!-- Animated-Style Packet Pulses along Edges -->
  <circle cx="72" cy="72" r="3" fill="#C8FF3D" filter="url(#glow-lime)"/>
  <circle cx="128" cy="72" r="3" fill="#5EE6F0" filter="url(#glow-cyan)"/>
  <circle cx="72" cy="128" r="3" fill="#5EE6F0" filter="url(#glow-cyan)"/>
  <circle cx="128" cy="128" r="3" fill="#C8FF3D" filter="url(#glow-lime)"/>

  <!-- Outer Satellite Nodes -->
  <!-- Node TL: Input / Ingest -->
  <circle cx="45" cy="45" r="10" fill="#07080B" stroke="#5EE6F0" stroke-width="2.5"/>
  <circle cx="45" cy="45" r="4.5" fill="#5EE6F0"/>

  <!-- Node TR: Tools / Action -->
  <circle cx="155" cy="45" r="10" fill="#07080B" stroke="#5EE6F0" stroke-width="2.5"/>
  <circle cx="155" cy="45" r="4.5" fill="#5EE6F0"/>

  <!-- Node BL: Memory / Context -->
  <circle cx="45" cy="155" r="10" fill="#07080B" stroke="#5EE6F0" stroke-width="2.5"/>
  <circle cx="45" cy="155" r="4.5" fill="#5EE6F0"/>

  <!-- Node BR: Output / Evaluator -->
  <circle cx="155" cy="155" r="10" fill="#07080B" stroke="#5EE6F0" stroke-width="2.5"/>
  <circle cx="155" cy="155" r="4.5" fill="#5EE6F0"/>

  <!-- Core Hub Node: The State Checkpoint & Central Orchestrator -->
  <circle cx="100" cy="100" r="18" fill="#C8FF3D" fill-opacity="0.15" filter="url(#glow-lime)"/>
  <circle cx="100" cy="100" r="14" fill="#07080B" stroke="#C8FF3D" stroke-width="3"/>
  <circle cx="100" cy="100" r="6" fill="#C8FF3D" filter="url(#glow-lime)"/>
</svg>
