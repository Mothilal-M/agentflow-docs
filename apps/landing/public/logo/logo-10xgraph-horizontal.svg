<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="h-edge" x1="25" y1="25" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EE6F0"/>
      <stop offset="100%" stop-color="#C8FF3D"/>
    </linearGradient>
  </defs>

  <!-- Left Mark (Based on Intersecting Matrix, sized 100x100 within x=10..110, y=10..110) -->
  <g transform="translate(10, 10)">
    <!-- Halo -->
    <circle cx="50" cy="50" r="38" stroke="#C8FF3D" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.4"/>
    
    <!-- Edges -->
    <line x1="22" y1="22" x2="50" y2="50" stroke="url(#h-edge)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="78" y2="78" stroke="url(#h-edge)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="78" y1="22" x2="50" y2="50" stroke="url(#h-edge)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="22" y2="78" stroke="url(#h-edge)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Satellites -->
    <circle cx="22" cy="22" r="6" fill="#07080B" stroke="#5EE6F0" stroke-width="2"/>
    <circle cx="22" cy="22" r="2.5" fill="#5EE6F0"/>
    <circle cx="78" cy="22" r="6" fill="#07080B" stroke="#5EE6F0" stroke-width="2"/>
    <circle cx="78" cy="22" r="2.5" fill="#5EE6F0"/>
    <circle cx="22" cy="78" r="6" fill="#07080B" stroke="#5EE6F0" stroke-width="2"/>
    <circle cx="22" cy="78" r="2.5" fill="#5EE6F0"/>
    <circle cx="78" cy="78" r="6" fill="#07080B" stroke="#5EE6F0" stroke-width="2"/>
    <circle cx="78" cy="78" r="2.5" fill="#5EE6F0"/>

    <!-- Core Hub -->
    <circle cx="50" cy="50" r="9" fill="#07080B" stroke="#C8FF3D" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="4" fill="#C8FF3D" filter="url(#h-glow)"/>
  </g>

  <!-- Typography: "10xGraph" -->
  <text x="135" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ECEAE3" letter-spacing="-1.5">
    10<tspan fill="#C8FF3D">x</tspan>Graph
  </text>
  
  <!-- Subtle Badge Subtitle -->
  <rect x="365" y="44" width="76" height="22" rx="11" fill="#C8FF3D" fill-opacity="0.12" stroke="#C8FF3D" stroke-opacity="0.3" stroke-width="1"/>
  <text x="403" y="59" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="600" fill="#C8FF3D" text-anchor="middle" letter-spacing="1">ENGINE</text>
</svg>
